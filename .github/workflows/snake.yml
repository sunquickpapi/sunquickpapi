name: Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#E23636&color_dots=#FFF6E0,#8DB5F2,#2F6FD6,#16337A,#E23636
            dist/snake-dark.svg?palette=github-dark&color_snake=#E23636&color_dots=#161B22,#16337A,#2F6FD6,#8DB5F2,#E23636

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
